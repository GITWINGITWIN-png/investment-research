[project]
name = "finbg"
version = "0.1.0"
description = "Background track: PIT data collection, paper baselines, and situation briefs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "feedparser>=6.0.14",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
    "yfinance>=1.5.2",
]

[project.scripts]
finbg = "finbg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finbg"]
